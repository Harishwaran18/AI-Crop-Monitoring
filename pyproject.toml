[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropmon"
version = "1.0.0"
description = "AI crop monitoring: spectral indices + micro-climate fusion, zone risk scoring, alerts, dashboard, and API (SIH25099)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Auto_Scientist contributors" }]
keywords = ["precision-agriculture", "multispectral", "ndvi", "remote-sensing", "crop-health"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "plotly>=5.18",
  "streamlit>=1.32",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.26",
  "joblib>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
deep = ["tensorflow>=2.15"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.26"]

[project.scripts]
cropmon = "cropmon.cli:main"

[project.urls]
Homepage = "https://github.com/Harishwaran18/Auto_Scientist"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cropmon"]
